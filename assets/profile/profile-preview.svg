    <text x="566" y="56" fill="#F4F6FA" font-size="18" font-family="Segoe UI, Arial, sans-serif">JavaScript | TypeScript | Python | HTML | CSS | Next.js</text>
    <text x="566" y="84" fill="#F4F6FA" font-size="18" font-family="Segoe UI, Arial, sans-serif">MySQL | MongoDB | PostgreSQL | Git | SAP ERP | CRM</text>
  </g>

