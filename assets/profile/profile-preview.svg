    <text x="18" y="142" fill="#A5AEC4" font-size="15" font-family="Segoe UI, Arial, sans-serif">- Soporte a usuarios y registro de cursos</text>
    <text x="18" y="168" fill="#A5AEC4" font-size="15" font-family="Segoe UI, Arial, sans-serif">- Coordinacion con SAP ERP y CRM</text>

    <rect x="554" y="0" width="262" height="206" rx="16" fill="#151A2A" stroke="#2B3146"/>
    <text x="572" y="30" fill="#62C6FF" font-size="14" font-family="Segoe UI, Arial, sans-serif">Educacion</text>
    <text x="572" y="62" fill="#F4F6FA" font-size="15" font-family="Segoe UI, Arial, sans-serif">Riwi - Desarrollo de Software</text>
    <text x="572" y="82" fill="#95A0B8" font-size="13" font-family="Segoe UI, Arial, sans-serif">2025 - En curso</text>
    <text x="572" y="110" fill="#F4F6FA" font-size="15" font-family="Segoe UI, Arial, sans-serif">Cesde - Desarrollo de Software</text>
    <text x="572" y="130" fill="#95A0B8" font-size="13" font-family="Segoe UI, Arial, sans-serif">2024 - 2025</text>
    <text x="572" y="158" fill="#F4F6FA" font-size="15" font-family="Segoe UI, Arial, sans-serif">Smart - Ingles A1</text>
    <text x="572" y="178" fill="#95A0B8" font-size="13" font-family="Segoe UI, Arial, sans-serif">En curso</text>

    <rect x="830" y="0" width="264" height="206" rx="16" fill="#151A2A" stroke="#2B3146"/>
