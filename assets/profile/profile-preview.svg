<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Valeria Taborda profile visual</title>
  <desc id="desc">Static preview inspired by the interactive profile page, intended for GitHub README.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090A0F"/>
      <stop offset="1" stop-color="#121523"/>
    </linearGradient>
    <radialGradient id="orb1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(170 110) rotate(16) scale(360 280)">
      <stop stop-color="#0A84FF" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1090 640) rotate(-15) scale(340 260)">
      <stop stop-color="#30D158" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#30D158" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#141828"/>
      <stop offset="1" stop-color="#101422"/>
    </linearGradient>
    <linearGradient id="avatarRing" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0A84FF"/>
      <stop offset="0.5" stop-color="#BF5AF2"/>
      <stop offset="1" stop-color="#FF375F"/>
    </linearGradient>
    <clipPath id="avatarClip">
      <circle cx="63" cy="63" r="58"/>
    </clipPath>
    <filter id="shadow" x="0" y="0" width="200%" height="200%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <ellipse cx="170" cy="110" rx="360" ry="280" fill="url(#orb1)"/>
  <ellipse cx="1090" cy="640" rx="340" ry="260" fill="url(#orb2)"/>

  <rect x="52" y="52" width="1176" height="616" rx="34" fill="url(#frame)" stroke="#2A3044" stroke-opacity="0.68" filter="url(#shadow)"/>

  <g transform="translate(94 92)">
