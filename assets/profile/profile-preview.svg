    <circle cx="63" cy="63" r="58" fill="#1C2130"/>
    <image href="memoji.jpg" x="5" y="5" width="116" height="116" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatarClip)"/>
    <circle cx="101" cy="102" r="12" fill="#30D158" stroke="#101422" stroke-width="4"/>

    <text x="158" y="30" fill="#9AA1B8" font-size="21" font-family="Segoe UI, Arial, sans-serif">Medellin, Colombia</text>
