    <text x="18" y="60" fill="#F4F6FA" font-size="24" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Administrative Assistant - Comfama</text>
    <text x="18" y="84" fill="#8A93AB" font-size="14" font-family="Segoe UI, Arial, sans-serif">Jun 2023 - Dec 2023</text>
